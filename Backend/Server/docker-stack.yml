version: "3.8"

services:
  nginx:
    image: 192.168.56.11:5001/nginx-proxy:latest
    ports:
      - "443:443"
    networks:
      - test-net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - test-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  manager:
    image: 192.168.56.11:5001/manager-test:latest
    ports:
      - "5000:5000"
    volumes:
      - /home/vagrant/Server/aes_key.txt:/app/aes-key:ro
    environment:
      - WORKER1_SERVICE=worker1
      - WORKER2_SERVICE=worker2
      - WORKER3_SERVICE=worker3
    networks:
      - test-net
      - monitoring_monitor-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.role == manager

  worker1:
    image: 192.168.56.11:5001/worker1-test:latest
    networks:
      - test-net
      - monitoring_monitor-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.role == worker1

  worker2:
    image: 192.168.56.11:5001/worker2-test:latest
    networks:
      - test-net
      - monitoring_monitor-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.role == worker2

  worker3:
    image: 192.168.56.11:5001/worker3-test:latest
    networks:
      - test-net
      - monitoring_monitor-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.role == worker3

networks:
  test-net:
    driver: overlay
  monitoring_monitor-net:
    external: true