global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'flask_apps'
    static_configs:
      - targets:
          - 'mystack_manager:5000'
          - 'mystack_worker1:6000'
          - 'mystack_worker2:6000'
          - 'mystack_worker3:6000'